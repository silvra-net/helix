[workspace]
members = [
    "crates/helix-crypto",
    "crates/helix-core",
    "crates/helix-consensus",
    "crates/helix-executor",
    "crates/helix-mempool",
    "crates/helix-p2p",
    "crates/helix-storage",
    "crates/helix-identity",
    "crates/helix-rpc",
    "crates/helix-node",
    "crates/helix-cli",
    "crates/helix-vm",
    "crates/helix-zkp",
]
# gui/ is a Tauri desktop app (own webview/system deps) — kept out of the workspace so
# `cargo build/test --workspace` stays exactly as before. It path-depends on helix-crypto /
# helix-core to reuse the real ML-DSA signing + transaction types (no re-implementation).
exclude = ["gui"]
resolver = "2"

[workspace.package]
# Kept in lockstep with the released git tag: the release workflow refuses to build a
# `vX.Y.Z` tag whose version does not match this line.
#
# 0.x on purpose. This shipped as v1.0.0 eleven days into the project and climbed to v1.4.0
# within the week, which told anyone reading semver that the API was stable — while the chain
# was being reset from genesis every few days, ran on a single validator, and changed its block
# format three times. 1.0 is a promise about stability that nothing here can keep yet. It costs
# nothing to say so, and claiming otherwise cost credibility that the rest of the project works
# hard to earn.
version = "0.14.2"
edition = "2021"
authors = ["SILVRA"]
license = "MIT"

[workspace.dependencies]
# Post-Quantum Cryptography — final NIST FIPS standards (RustCrypto, pure Rust)
ml-dsa = "0.1.1"       # FIPS 204 ML-DSA (signatures)
slh-dsa = "0.2.0-rc.5" # FIPS 205 SLH-DSA (hash-based signature migration target)
rand_core = "0.10"     # slh-dsa keygen wants a rand_core 0.10 CryptoRng (bridged from rand's OsRng)
blake3 = "1.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"
hex = "0.4"
bs58 = "0.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Filesystem stats for `GET /diagnostics` (free space on the chain volume). Deliberately rustix
# rather than `libc`: `statvfs` is the one thing a node operator's dashboard needs that std does
# not expose, and rustix wraps it in a *safe* function. This crate has no `unsafe` anywhere in
# its own code, and getting a disk figure was not worth being the first exception. rustix was
# already in the lock file as a transitive dependency, so this adds no new supply-chain surface.
rustix = { version = "1.1", features = ["fs"] }

# P2P networking
libp2p = { version = "0.54", features = [
    "tcp", "noise", "yamux",
    "gossipsub", "mdns",
    "tokio", "dns", "macros",
    # Directed request/response for block sync (#138). Gossipsub can only broadcast, so before
    # this a node that fell behind could not *ask* anyone for the blocks it was missing — its only
    # catch-up route was an operator-configured RPC `sync_peer`, and a node without one (the origin
    # node) could never recover from a single missed block. See `blocksync` in helix-p2p.
    "request-response",
    # Lets a node be reachable through an HTTPS reverse proxy / Cloudflare tunnel on
    # port 443, where raw TCP is not routable. See `P2PConfig::ws_listen_addr`.
    "websocket",
] }
void = "1"
# Required to implement libp2p's `request_response::Codec`, which is declared `#[async_trait]`
# (#138). Already in the tree as a transitive dependency of libp2p-request-response, so this only
# makes an existing dependency direct.
async-trait = "0.1"

# Wallet encryption
aes-gcm = "0.10"
argon2 = "0.5"

# ZK-STARK proofs (NIST finalist — ZK Proof of Personhood)
winterfell = "0.13"

# Persistence
redb = "2.1"

# WASM smart contract execution
wasmi = "0.31"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
# `gzip` so the historical sync actually asks for the compression the RPC server now offers —
# without it reqwest sends no `Accept-Encoding` and every catch-up pulls full-size JSON (7.6 MB
# per 200 blocks instead of 2.0 MB, measured 2026-07-21).
reqwest = { version = "0.12", features = ["json", "blocking", "gzip"] }

# Internal crates
helix-crypto = { path = "crates/helix-crypto" }
helix-core = { path = "crates/helix-core" }
helix-consensus = { path = "crates/helix-consensus" }
helix-p2p = { path = "crates/helix-p2p" }
helix-storage = { path = "crates/helix-storage" }
helix-identity = { path = "crates/helix-identity" }
helix-executor = { path = "crates/helix-executor" }
helix-mempool = { path = "crates/helix-mempool" }
helix-rpc = { path = "crates/helix-rpc" }
helix-vm = { path = "crates/helix-vm" }
helix-zkp = { path = "crates/helix-zkp" }
helix-cli = { path = "crates/helix-cli" }

# Arithmetic overflow panics instead of wrapping, in release as well as debug.
#
# Rust's default for release is to wrap. On a chain that is the worst failure mode available: a
# wrapped `u64` on the ledger is money created from nothing, every node computes the same wrong
# number, nothing forks, and nothing complains. That is not hypothetical here — a contract call
# reached exactly that on 2026-08-05, reporting success while putting 18.4 billion HLX into an
# account on a chain capped at 33 million. The identical code panicked immediately in the test
# build. The bug was fixed; the reason it was silent in the shipped binary was this setting.
#
# Measured cost: ~15% on transaction execution (2000 transfers, 377ms -> 435ms). Signature and
# hash throughput are unchanged — blake3 and ml-dsa use explicit `wrapping_*`, as good crypto
# crates do. A block that currently carries no transactions at all can afford this many times over,
# and a supply cap that cannot be trusted is worth nothing at any speed.
#
# The trade is deliberate: a panic mid-block is a liveness failure, and a loud one. Wrapping is a
# safety failure, and a silent one. Given the choice, take the loud one — a halted chain gets
# patched, minted money does not get un-minted.
[profile.release]
overflow-checks = true
