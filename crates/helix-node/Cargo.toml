[package]
name = "helix-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Helix blockchain node binary"

[[bin]]
name = "helix"
path = "src/main.rs"

[dependencies]
helix-crypto.workspace = true
helix-core.workspace = true
helix-consensus.workspace = true
helix-executor.workspace = true
helix-mempool.workspace = true
helix-p2p.workspace = true
helix-storage.workspace = true
helix-identity.workspace = true
helix-rpc.workspace = true
helix-cli.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
toml.workspace = true
anyhow.workspace = true
reqwest.workspace = true
libp2p.workspace = true

[dev-dependencies]
axum.workspace = true
# A paused clock for timer-driven loops (`start_paused`): a test of "does not wait for its next
# tick" is exact on virtual time and a coin flip on the wall clock. Same tokio, one more feature.
tokio = { workspace = true, features = ["test-util"] }
