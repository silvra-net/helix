[package]
name = "helix-rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "REST + WebSocket API for Helix node — client-facing interface"

[dependencies]
helix-crypto.workspace = true
helix-core.workspace = true
helix-storage.workspace = true
helix-mempool.workspace = true
helix-executor.workspace = true
helix-identity.workspace = true
helix-p2p.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
axum.workspace = true
tower-http.workspace = true
hex.workspace = true
bincode.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Unix only: its sole use is `statvfs` for the diagnostics endpoint, and rustix configures its
# `fs` module out on Windows — declaring the dependency there would pull a crate whose only
# needed module does not exist. See `disk_stats`.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true
