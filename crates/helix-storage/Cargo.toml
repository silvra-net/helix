[package]
name = "helix-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Persistent storage layer for Helix blockchain state"

[dependencies]
helix-crypto.workspace = true
helix-core.workspace = true
helix-executor.workspace = true
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
redb.workspace = true
tracing.workspace = true

[dev-dependencies]
helix-identity.workspace = true

# Unix only: `statvfs` for the free-space reserve (#245). rustix configures its `fs` module out on
# Windows — declaring the dependency there would pull a crate whose only needed module does not
# exist. See `free_disk_bytes`.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true
