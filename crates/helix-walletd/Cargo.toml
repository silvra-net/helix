[package]
name = "helix-walletd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A wallet with Bitcoin Core's JSON-RPC interface, in front of a Helix node, for exchanges"

[dependencies]
helix-core.workspace = true
helix-crypto.workspace = true
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
redb.workspace = true
rand.workspace = true
hex.workspace = true
zeroize.workspace = true
base64 = "0.22"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
ipnet = "2.12"
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
# A paused clock: the wait for a wrong password is measured exactly, not against a busy machine.
tokio = { workspace = true, features = ["test-util"] }
